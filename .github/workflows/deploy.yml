# Publica el sitio en GitHub Pages cada vez que se hace push a la rama main
# (o manualmente desde la pestaña Actions → "Run workflow").
# Requisito (una sola vez): en el repositorio, Settings → Pages → Source = "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos para publicar en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos publicaciones seguidas, se queda la más reciente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `npm run build` compila, prerenderiza las páginas y falla si TypeScript encuentra errores.
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
